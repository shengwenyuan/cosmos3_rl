# DROID Fx4 Stage-1 EEF policy on 32 GPUs. Effective global batch:
# 1 sample/rank x 32 ranks x grad_accum 8 = 256.
# Required env: DROID_ROOT, FX4_TRAIN_MANIFEST, ACTION_STATS_PATH,
# EDGE_BASE_PATH, BASE_CHECKPOINT_PATH, WAN_VAE_PATH, IMAGINAIRE_OUTPUT_ROOT.

[job]
task       = "vfm"
experiment = "action_policy_droid_eef_edge"
project    = "cosmos3_action_droid_eef"
group      = "stage1_c32"
name       = "action_policy_droid_eef_edge_32gpu"
wandb_mode = "online"

[model]
precision                    = "bfloat16"
max_num_tokens_after_packing = -1

[model.parallelism]
data_parallel_shard_degree     = 8
data_parallel_replicate_degree = 4
context_parallel_shard_degree  = 1
cfg_parallel_shard_degree      = 1

[model.activation_checkpointing]
mode           = "full"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 1.0e-05

[scheduler]
cycle_lengths = [6500]
warm_up_steps = [500]

[trainer]
max_iter        = 6500
logging_iter    = 10
grad_accum_iter = 8

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 500

[dataloader_train]
max_samples_per_batch = 1

[dataloader_train.dataloader]
batch_size      = 1
num_workers     = 4
prefetch_factor = 2
