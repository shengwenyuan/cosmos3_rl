# Cosmos3-Edge full LIBERO four-suite SFT on one 8-GPU RPBZZZ6 node.
# Effective global batch = 128 samples/rank x 8 ranks x grad_accum 2 = 2048.
# Required env: LIBERO_ROOT, EDGE_BASE_PATH, BASE_CHECKPOINT_PATH, WAN_VAE_PATH,
# IMAGINAIRE_OUTPUT_ROOT. See docs/action_policy_libero_edge_posttrain.md.

[job]
task         = "vfm"
experiment   = "action_policy_libero_all_edge"
project      = "cosmos3_action_libero"
group        = "action_sft_edge"
name         = "action_policy_libero_all_edge_8gpu"
wandb_mode   = "online"

[model]
precision                    = "bfloat16"
max_num_tokens_after_packing = 74000

[model.parallelism]
data_parallel_shard_degree     = 8
data_parallel_replicate_degree = 1
context_parallel_shard_degree  = 1
cfg_parallel_shard_degree      = 1

[model.activation_checkpointing]
mode           = "selective"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-05

[scheduler]
cycle_lengths = [16000]
warm_up_steps = [500]

[trainer]
max_iter        = 5000
logging_iter    = 50
grad_accum_iter = 2

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 500

[dataloader_train]
max_samples_per_batch = 128
